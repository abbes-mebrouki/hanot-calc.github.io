<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="حاسبة شراء وربح طلبيات الأحذية — تعمل دون اتصال">
<meta name="theme-color" content="#f2f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1511" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الطلبية">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>حاسبة الطلبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 560px app column, sticky page header, cards stacked, fixed bottom tab bar + floating add button (RTL). */
:root{
  --bg:#f2f6f1; --surface:#ffffff; --surface-2:#edf3ec; --line:#dbe4da; --line-soft:#e8eee7;
  --fg:#16211a; --muted:#5b6a60; --faint:#8a978e;
  --brand:#1c5a39; --brand-2:#13452b; --brand-text:#1c5a39; --brand-soft:#cbe9d4; --on-brand:#ffffff;
  --hero-a:#1f6340; --hero-b:#154a30; --on-hero:#f2fbf5; --hero-muted:#a9d6b9; --hero-tile:rgba(255,255,255,.08);
  --good:#1d7a44; --good-soft:#dcf1e3; --bad:#b4261b; --bad-soft:#fde8e5; --warn:#94580a; --warn-soft:#fcf0d7; --warn-line:#f1d9a6;
  --shadow:0 1px 2px rgba(22,33,26,.05),0 4px 14px rgba(22,33,26,.05);
  --scrim:rgba(14,22,17,.45);
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --r-lg:18px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#151f19; --surface-2:#1b2820; --line:#27362c; --line-soft:#202e25;
  --fg:#e6efe8; --muted:#9caca1; --faint:#728277;
  --brand:#2a7a4f; --brand-2:#226741; --brand-text:#74d39d; --brand-soft:#1d3d2a; --on-brand:#ffffff;
  --hero-a:#1b5537; --hero-b:#123b26; --on-hero:#eefaf2; --hero-muted:#93cba7; --hero-tile:rgba(255,255,255,.07);
  --good:#6fd39a; --good-soft:#163522; --bad:#ff8f80; --bad-soft:#3a1c18; --warn:#f0b965; --warn-soft:#332710; --warn-line:#5a4417;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#151f19; --surface-2:#1b2820; --line:#27362c; --line-soft:#202e25;
  --fg:#e6efe8; --muted:#9caca1; --faint:#728277;
  --brand:#2a7a4f; --brand-2:#226741; --brand-text:#74d39d; --brand-soft:#1d3d2a; --on-brand:#ffffff;
  --hero-a:#1b5537; --hero-b:#123b26; --on-hero:#eefaf2; --hero-muted:#93cba7; --hero-tile:rgba(255,255,255,.07);
  --good:#6fd39a; --good-soft:#163522; --bad:#ff8f80; --bad-soft:#3a1c18; --warn:#f0b965; --warn-soft:#332710; --warn-line:#5a4417;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}
.ic{flex:none;display:block}
.num{unicode-bidi:isolate;direction:ltr;display:inline-block;font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.hdr .logo{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--brand-text)}
.hdr .ttl{flex:1;min-width:0}
.hdr h1{margin:0;font-size:21px;line-height:1.25;font-weight:700;color:var(--brand-text)}
.hdr .sub{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px}
.hdr .sub.bad{color:var(--warn)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--fg)}
.iconbtn.ghost{border-color:transparent;background:transparent}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding-bottom:12px;margin-bottom:4px;border-bottom:1px solid var(--line-soft)}
.card-h .bx{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--brand-text)}
.card-h h2{margin:0;font-size:18px;font-weight:700;flex:1;text-wrap:balance}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-block:9px;font-size:14.5px}
.row + .row{border-top:1px solid var(--line-soft)}
.row .k{color:var(--muted)}
.row .v{font-weight:600;white-space:nowrap}
.row.total{border-top:1px solid var(--line);margin-top:2px;padding-top:12px}
.row.total .k{color:var(--fg);font-weight:700}
.row.total .v{font-size:19px;font-weight:700}
.row.hl{background:var(--surface-2);margin-inline:-8px;padding-inline:8px;border-radius:8px;border-top-color:transparent}
.row.hl + .row{border-top-color:transparent}
.row .note{display:block;font-size:12px;color:var(--faint);font-weight:400}

.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}

/* hero */
.hero{background:linear-gradient(155deg,var(--hero-a),var(--hero-b));color:var(--on-hero);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.hero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero .lbl{color:var(--hero-muted);font-size:14px;font-weight:500}
.hero .big{font-size:34px;font-weight:700;line-height:1.2;margin-top:4px}
.hero .big small{font-size:18px;font-weight:600;margin-inline-start:4px;color:var(--hero-muted)}
.hero .pill{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;color:var(--on-hero)}
.hero .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)}
.hero .tile{background:var(--hero-tile);border-radius:12px;padding:10px 12px}
.hero .tile .t{font-size:12.5px;color:var(--hero-muted)}
.hero .tile .n{font-size:18px;font-weight:700}

.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px 8px;text-align:center}
.stat .t{font-size:12.5px;color:var(--muted)}
.stat .n{font-size:22px;font-weight:700;color:var(--brand-text)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:12px 4px}
.tiles2 .stat{text-align:start;padding:10px 12px}
.tiles2 .stat .n{font-size:18px}

.bar{height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:14px;border:1px solid var(--line-soft)}
.bar > span{display:block;height:100%;background:var(--brand);border-radius:99px}
.barlbl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px;margin-bottom:6px}
.barlbl b{color:var(--fg)}

.pick{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;margin-top:10px;width:100%;text-align:start}
.pick .bx{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.pick .bx.good{background:var(--good-soft);color:var(--good)}
.pick .bx.bad{background:var(--bad-soft);color:var(--bad)}
.pick .m{flex:1;min-width:0}
.pick .m small{display:block;color:var(--muted);font-size:12px}
.pick .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .amt{font-weight:700;font-size:14px;white-space:nowrap}
.alertbar{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--fg);border-radius:12px;padding:12px;text-align:start}
.alertbar .ic{color:var(--warn)}
.alertbar b{flex:1}
.alertbar span{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:2px}
.okbar{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--good-soft);color:var(--good);border-radius:12px;padding:12px;font-weight:600}

/* products */
.pagehead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pagehead .count{background:var(--surface-2);border-radius:99px;padding:1px 10px;font-weight:700;font-size:14px}
.pagehead .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;font-weight:600;font-size:14px;min-height:42px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.block{width:100%;min-height:54px;font-size:16px;border-radius:14px}
.btn.textonly{border-color:transparent;background:transparent;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:default}
.search{position:relative}
.search input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding-inline:44px 14px}
.search .ic{position:absolute;inset-inline-start:14px;top:15px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 14px;font-weight:600;font-size:14px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.select{position:relative}
.select select{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 14px 7px 34px;font-weight:600;font-size:14px;min-height:40px}
.select .ic{position:absolute;inset-inline-end:10px;top:11px;pointer-events:none;color:var(--muted)}
.tools .sp{flex:1}

.pcard{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);cursor:pointer}
.pcard.off{opacity:.62;border-style:dashed;background:var(--surface-2)}
.pcard.off .p.muted{color:var(--muted);text-decoration:line-through}
.pcard.off .mg.muted{color:var(--muted)!important}
tbody tr.off{opacity:.55;background:var(--surface-2)}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);border:1px solid var(--line);padding:2px;display:inline-flex;align-items:center;cursor:pointer;flex:none;transition:background .2s ease,border-color .2s ease;box-sizing:border-box;position:relative}
.sw::after{content:'';position:absolute;inset:-8px -6px}
.sw.on{background:var(--brand);border-color:var(--brand)}
.sw .knob{width:18px;height:18px;border-radius:50%;background:#fff;display:block;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.4,0,.2,1);transform:translateX(0)}
[dir="rtl"] .sw.on .knob{transform:translateX(-18px)}
[dir="ltr"] .sw.on .knob{transform:translateX(18px)}
.sw:active .knob{width:21px}
.pcard:hover{border-color:var(--brand-soft)}
.pcard .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.pcard .nm{font-size:18px;font-weight:700;line-height:1.3;overflow-wrap:anywhere;display:flex;align-items:flex-start;gap:8px}
.pcard .nm .nt{min-width:0}
.pcard .pico{display:block;flex:none;line-height:0;margin-top:1px;color:var(--brand-text)}
.pcard .meta{font-size:13px;color:var(--muted)}
.pcard .meta b{color:var(--fg);font-weight:600}
.pcard .fig{text-align:end;flex:none}
.pcard .fig .p{font-size:22px;font-weight:700;white-space:nowrap}
.pcard .fig .mg{font-size:13px;font-weight:600}
.pcard > .ic{color:var(--faint)}
.pcard.off .pico{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)} .wtxt{color:var(--warn)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.foot b{font-size:18px}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.empty h3{color:var(--fg);margin:0 0 6px;font-size:17px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table{border-collapse:collapse;font-size:13px;min-width:1500px;width:100%}
th,td{padding:9px 10px;text-align:start;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
th{background:var(--surface-2);font-weight:600;color:var(--muted);position:sticky;top:0}
td:first-child,th:first-child{position:sticky;right:0;background:var(--surface);font-weight:600;z-index:1;box-shadow:-1px 0 0 var(--line)}
th:first-child{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--surface-2)}
tfoot td:first-child{background:var(--surface-2)}
tbody tr{cursor:pointer}

/* detail */
.dtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;padding-block:10px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.dtop .ttl{flex:1;min-width:0}
.dtop .ttl small{display:block;font-size:12px;color:var(--muted)}
.dtop .ttl b{display:block;font-size:18px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);height:40px}
.pager button{border:0;background:transparent;width:32px;height:38px;display:grid;place-items:center}
.pager button[disabled]{opacity:.3}
.pager span{font-size:13px;font-weight:600;min-width:36px;text-align:center}
.menuwrap{position:relative}
.menu{position:absolute;inset-inline-end:0;top:48px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:6px;min-width:180px;z-index:40}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:10px 12px;border-radius:10px;text-align:start}
.menu button:hover{background:var(--surface-2)}
.menu button.d{color:var(--bad)}
.editrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:10px}
.editrow + .editrow{border-top:1px solid var(--line-soft)}
.editrow label{color:var(--muted);font-size:14.5px;flex:1;min-width:0}
.editrow label small{display:block;font-size:12px;color:var(--faint)}
.editrow .err{display:block;font-size:12px;color:var(--bad);font-weight:600}
.mini{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;height:44px}
.mini input{width:84px;border:0;background:transparent;text-align:center;font-weight:700;font-size:16px;height:100%;font-variant-numeric:tabular-nums;direction:ltr}
.mini .u{font-size:12px;color:var(--muted);padding-inline:0 10px}
.mini button{width:40px;height:100%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--brand-text)}
.mini.bad{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft)}
.mini.solo input{width:96px}
textarea.notes{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;resize:vertical}
.tag{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:2px 8px;font-weight:500}
.tips{background:var(--good-soft);border-color:transparent}
.tips .card-h{border-bottom-color:rgba(0,0,0,.06)}
.tips .card-h .bx{background:var(--surface)}
.tip{display:flex;gap:10px;align-items:flex-start;padding-block:10px;font-size:14.5px}
.tip .ic{color:var(--brand-text);margin-top:2px}
.tipbox{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:6px}
.tipbox .m{flex:1}
.tipbox small{display:block;color:var(--muted);font-size:12.5px}
.tipbox b{font-size:18px}
input[type=range]{width:100%;accent-color:var(--brand);height:28px;margin-top:6px}
.rangelbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.wi-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}
.wi-head b{font-size:22px;color:var(--brand-text)}
.wi-out{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px;margin-top:12px;flex-wrap:wrap}
.wi-out .m{flex:1;min-width:150px}
.wi-out small{display:block;color:var(--muted);font-size:12.5px}
.wi-out b{font-size:18px}

/* bottom nav + fab */
.nav{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 16px}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13px;padding:6px 4px;border-radius:14px}
.nav a[aria-current="page"]{background:var(--brand-soft);color:var(--brand-text)}
.fab{position:fixed;z-index:26;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:max(16px,calc(50% - 264px),env(safe-area-inset-left,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 6px 18px rgba(19,69,43,.35)}

/* sheet + dialog */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim.center{align-items:center;padding:16px}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92dvh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;border-bottom:1px solid var(--line)}
.sheet .sh h2{margin:0;font-size:19px;flex:1}
.sheet .sb{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.sheet .sf{padding:12px 16px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label{font-weight:600;font-size:14.5px}
.field > label .req{color:var(--bad)}
.inp{display:flex;align-items:center;height:54px;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.inp input{flex:1;min-width:0;border:0;background:transparent;height:100%;padding-inline:14px;font-size:17px;font-weight:600}
.inp input.n{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.inp .u{color:var(--muted);font-size:13px;padding-inline:0 12px}
.inp button{width:44px;height:100%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--brand-text)} .inp button:active,.mini button:active{background:var(--line)}
.inp.bad{border-color:var(--bad);border-width:2px}
.field .help{font-size:12.5px;color:var(--muted)}
.field .help.e{color:var(--bad);font-weight:600}
.errbox{background:var(--bad-soft);border:1px solid var(--bad);border-radius:14px;padding:10px}
.more{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;width:100%;text-align:start;font-weight:600}
.more span{flex:1}
.preview{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;background:var(--good-soft);color:var(--fg)}
.preview.warn{background:var(--warn-soft)} .preview.bad{background:var(--bad-soft)}
.preview .m{flex:1}
.dialog{background:var(--surface);border-radius:20px;padding:20px;max-width:400px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog h3{margin:0 0 6px;font-size:18px}
.dialog p{margin:0 0 16px;color:var(--muted)}
.dialog .acts{display:flex;gap:10px;justify-content:flex-start}

/* settings */
.setfield{display:flex;flex-direction:column;gap:6px;padding-block:10px}
.setfield label{font-weight:600}
.setfield .help{font-size:12.5px;color:var(--muted);display:flex;gap:5px;align-items:center}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:12px;padding:12px;font-size:14px;margin-block:12px 6px}
.banner .ic{color:var(--warn);margin-top:2px}
.banner.ok{background:var(--good-soft);border-color:transparent}
.banner.ok .ic{color:var(--good)}
.act{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px 2px;text-align:start}
.act + .act{border-top:1px solid var(--line-soft)}
.act .bx{width:42px;height:42px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--brand-text);flex:none}
.act .m{flex:1;min-width:0}
.act .m b{display:block}
.act .m small{color:var(--muted);font-size:12.5px}
.act > .ic{color:var(--faint)}
.act.danger{background:var(--bad-soft);border-radius:12px;padding:12px;margin-top:12px;color:var(--bad)}
.act.danger .bx{background:var(--surface);color:var(--bad)}
.act.danger .m small{color:var(--bad);opacity:.8}
.howto{margin:8px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.howto li{counter-increment:s;display:flex;gap:10px;font-size:14px;color:var(--muted)}
.howto li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--good-soft);color:var(--good);font-weight:700;display:grid;place-items:center;font-size:13px}
.ver{text-align:center;color:var(--faint);font-size:12px;padding-top:6px}

.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
@media (max-width:380px){.tiles3 .stat .n{font-size:19px}.hero .big{font-size:30px}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const ic=(n,s=20,w=1.8)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||''}</svg>`;

/* ---------- product type → icon, read from the name ---------- */
// Arabic-aware normalisation: drop harakat/tatweel, unify alef/ya/ta-marbuta forms, lowercase Latin.
const normAr=s=>String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
// Checked in this order, first match wins (so "صانديلة طالو" is heels, while plain "صانديلة" is a sandal).
const SHOE_TYPES=[
  ['heel','صابو طالو طالون كعب كعبين اسكربان سكربان escarpin escarpins heel heels stiletto'],
  ['slipper','شبشب شباشب بابوج بابوش كروكس كروكص بنتوفه بنطوفه بانتوفل بنتوفل crocs croc pantoufle pantoufles pantofle slipper slippers'],
  ['slide','بليغه بلغه تلاكيت تلكيت ريش طبي حطبه claquette claquettes tong tongs slide slides'],
  ['sandal','صانديله صندل صنداله صنادل sandale sandales sandal sandals'],
  ['sneaker','باسكيت باسكت بلاسكيت بابي سبور سبورت رياضي نايك اديداس بوما كونفرس كونفيرس فانس جوردن sneaker sneakers basket baskets sport nike adidas puma converse vans jordan'],
  ['boot','بوط بوت بوتين جزمه سيفتي boot boots botte bottes bottine bottines']
].map(([icon,kw])=>[icon,new Set(kw.split(' ').map(normAr))]);
// Attached articles/conjunctions (الباسكيت، وباسكيت، بالباسكيت) and plural endings (بوطات، بوتين، slides) are peeled off before matching.
const WORD_PREF=['وال','بال','لل','فال','كال','ال','و','ب','ل','ف','ك'], WORD_SUFF=['ات','ين','ان','ه','s'];
function wordForms(w){
  const out=new Set([w]), todo=[w];
  while(todo.length){
    const x=todo.pop();
    for(const f of [...WORD_PREF,...WORD_SUFF]){
      const y=WORD_PREF.includes(f)?(x.startsWith(f)?x.slice(f.length):null):(x.endsWith(f)?x.slice(0,-f.length):null);
      if(y&&y.length>=3&&!out.has(y)){out.add(y);todo.push(y)}
    }
  }
  return out;
}
function shoeType(name){
  const forms=new Set();
  (normAr(name).match(/[a-zء-ي]+/g)||[]).forEach(w=>wordForms(w).forEach(f=>forms.add(f)));
  const hit=SHOE_TYPES.find(([,kw])=>[...kw].some(k=>forms.has(k)));
  return hit?hit[0]:'shoe';
}

/* ---------- storage ---------- */
const KEY='talabiya-calc-v1', THEME_KEY='talabiya-theme';
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const blankP=()=>({id:uid(),name:'',cartons:0,perCarton:0,buy:0,sell:0,soldPerCarton:0,extraPerCarton:0,clearance:0,notes:'',disabled:false});
function seed(){
  const mk=(name,c,pc,b,s,spc)=>Object.assign(blankP(),{name,cartons:c,perCarton:pc,buy:b,sell:s,soldPerCarton:spc});
  return {v:1,settings:{shared:0,target:0.3,currency:'دج'},products:[
    mk('باسكيت 125 كبار',6,24,125,190,20),mk('باسكيت 125 متوسط',6,24,125,190,20),mk('باسكيت 125 صغير',2,24,125,170,18)
  ],savedAt:null,lastBackup:null};
}
const N=v=>{const n=Number(v);return Number.isFinite(n)?n:0};
function cleanP(p){
  const o=blankP();
  if(p&&typeof p==='object'){
    if(typeof p.id==='string'&&p.id) o.id=p.id;
    o.name=String(p.name??'').slice(0,120);
    ['cartons','perCarton','buy','sell','soldPerCarton','extraPerCarton','clearance'].forEach(k=>o[k]=Math.max(0,N(p[k])));
    o.notes=String(p.notes??'').slice(0,500);
    o.disabled=Boolean(p.disabled);
  }
  return o;
}
function cleanState(d){
  const s=seed();
  if(!d||typeof d!=='object'||!Array.isArray(d.products)) return null;
  const st=d.settings||{};
  return {v:1,settings:{shared:Math.max(0,N(st.shared)),target:Math.min(0.95,Math.max(0,N(st.target??0.3))),currency:String(st.currency||'دج').slice(0,8)},
    products:d.products.map(cleanP).filter(p=>p.name.trim()),savedAt:d.savedAt||null,lastBackup:d.lastBackup||null};
}
let storageOk=true;
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){const d=cleanState(JSON.parse(raw)); if(d) return d;}}
  catch(e){storageOk=false}
  return seed();
}
let state=load();
let saveTimer=null;
function save(){
  state.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true}catch(e){storageOk=false}
  updateSaveLabel();
}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,250)}

/* ---------- theme ---------- */
function curTheme(){const t=document.documentElement.getAttribute('data-theme');if(t)return t;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
try{const t=localStorage.getItem(THEME_KEY);if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}
function toggleTheme(){const t=curTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',t);try{localStorage.setItem(THEME_KEY,t)}catch(e){}render()}

/* ---------- format ---------- */
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:2});
const r2=n=>Math.round(n*100)/100;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cur=()=>esc(state.settings.currency||'دج');
const num=n=>`<span class="num">${nf.format(r2(n))}</span>`;
const money=(n,sign)=>`<span class="num">${sign&&n>0?'+':''}${nf.format(r2(n))}</span> ${cur()}`;
const pct=x=>`<span class="num">${(r2(x*1000)/10).toFixed(1)}%</span>`;
function cartonsWord(n){n=Math.round(n);if(n===1)return 'كرطون واحد';if(n===2)return 'كرطونان';if(n>=3&&n<=10)return n+' كراطين';return n+' كرطون'}
function parseNum(str){
  let s=String(str??'').trim().replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g,'.').replace(/[,\s٬]/g,'');
  if(s==='') return {ok:true,v:0,empty:true};
  if(!/^-?\d*\.?\d+$/.test(s)&&!/^-?\d+\.$/.test(s)) return {ok:false};
  return {ok:true,v:parseFloat(s)};
}

/* ---------- calculations (mirror of the الحسابات sheet) ---------- */
function totalPiecesOf(list){return list.reduce((a,p)=>a+p.cartons*p.perCarton,0)}
function calc(p,s,totalPieces){
  const pieces=p.cartons*p.perCarton;
  const cartonPrice=p.perCarton*p.buy;
  const purchase=cartonPrice*p.cartons;
  const extra=p.extraPerCarton*p.cartons+(totalPieces===0?0:s.shared*pieces/totalPieces);
  const cost=purchase+extra;
  const unitCost=pieces===0?0:cost/pieces;
  const unitProfit=p.sell-unitCost;
  const margin=p.sell===0?0:unitProfit/p.sell;
  const sold=p.soldPerCarton*p.cartons;
  const remaining=pieces-sold;
  const sellRate=p.perCarton===0?0:p.soldPerCarton/p.perCarton;
  const sales=sold*p.sell;
  const clearanceRev=remaining*p.clearance;
  const revenue=sales+clearanceRev;
  const net=revenue-cost;
  const perCarton=p.cartons===0?0:net/p.cartons;
  const roi=cost===0?0:net/cost;
  const remainingValue=remaining*unitCost;
  const breakeven=(p.sell===0||p.cartons===0)?0:Math.ceil(cost/p.cartons/p.sell-1e-9);
  const suggested=pieces===0?0:Math.ceil(unitCost/(1-s.target)/5-1e-9)*5;
  let st;
  if(p.sell<=unitCost) st={label:'البيع أقل من التكلفة',tone:'bad'};
  else if(net<0) st={label:'خسارة',tone:'bad'};
  else if(p.soldPerCarton<breakeven) st={label:'أقل من التعادل',tone:'warn'};
  else if(roi<0.1) st={label:'ربح ضعيف',tone:'warn'};
  else st={label:'جيد',tone:'good'};
  return {p,pieces,cartonPrice,purchase,extra,cost,unitCost,unitProfit,margin,sold,remaining,sellRate,sales,clearanceRev,revenue,net,perCarton,roi,remainingValue,breakeven,suggested,status:st};
}
function compute(){
  const s=state.settings;
  const activeProducts=state.products.filter(p=>!p.disabled);
  const tp=totalPiecesOf(activeProducts);
  const rows=state.products.map(p=>calc(p,p.disabled?Object.assign({},s,{shared:0}):s,tp));
  const activeRows=rows.filter(r=>!r.p.disabled);
  const sum=k=>activeRows.reduce((a,r)=>a+r[k],0);
  const t={count:activeRows.length,totalCount:rows.length,disabledCount:rows.length-activeRows.length,cartons:activeProducts.reduce((a,p)=>a+p.cartons,0),pieces:tp,purchase:sum('purchase'),extra:sum('extra'),cost:sum('cost'),
    sold:sum('sold'),remaining:sum('remaining'),sales:sum('sales'),clearanceRev:sum('clearanceRev'),revenue:sum('revenue'),net:sum('net'),remainingValue:sum('remainingValue')};
  t.sellThrough=t.pieces===0?0:t.sold/t.pieces;
  t.netMargin=t.revenue===0?0:t.net/t.revenue;
  t.roi=t.cost===0?0:t.net/t.cost;
  t.alerts=activeRows.filter(r=>r.status.tone!=='good').length;
  if(activeRows.length){
    t.best=activeRows.reduce((b,r)=>r.net>b.net?r:b,activeRows[0]);
    t.worst=activeRows.reduce((b,r)=>r.net<b.net?r:b,activeRows[0]);
  } else if(rows.length){ t.best=rows[0]; t.worst=rows[0];
  }
  return {rows,t};
}

/* ---------- render ---------- */
function render(){
  const r=route();
  const v=document.getElementById('view');
  if(r.view==='summary') v.innerHTML=vSummary();
  else if(r.view==='products') v.innerHTML=vProducts();
  else if(r.view==='config') v.innerHTML=vConfig();
  else {v.innerHTML=vItem(r.id);detailCalc();}
  const tab=r.view==='item'?'products':r.view;
  const t=(h,l,i)=>`<a href="#${h}" ${tab===h?'aria-current="page"':''}>${ic(i,22)}<span>${l}</span></a>`;
  document.getElementById('navin').innerHTML=t('summary','الملخص','receipt')+t('products','المنتجات','cards')+t('config','الإعدادات','gear');
  document.getElementById('fab').hidden=r.view==='item';
}

let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
const layer=document.getElementById('layer');
function closeLayer(){layer.innerHTML='';document.body.style.overflow=''}
function confirmBox({title,body,yes,danger},onYes){
  layer.innerHTML=`<div class="scrim center" data-act="scrim"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${title}</h3><p>${body}</p>

  const b=document.getElementById('dlg-yes');b.focus();b.onclick=()=>{closeLayer();onYes()};
}

/* ---------- add / edit sheet ---------- */
let draft=null, draftIsNew=false, showMore=false;
function openSheet(id){
  const p=id?state.products.find(x=>x.id===id):null;
  draftIsNew=!p; draft=p?Object.assign({},p):blankP();
  showMore=!!(p&&(p.extraPerCarton||p.clearance||p.notes));
  const val=k=>draftIsNew&&draft[k]===0?'':draft[k];
  const nfld=(k,label,opts={})=>`<div class="field"><label for="f-${k}">${label}${opts.req?' <span class="req">*</span>':''}</label>
    <div class="inp" id="fw-${k}">${opts.step?`<button type="button" data-act="fstep" data-f="${k}" data-d="${opts.step===true?1:opts.step}" aria-label="زيادة">${ic('plus',18,2.2)}</button>`:''}
    <input class="n" id="f-${k}" data-sf="${k}" inputmode="${opts.int?'numeric':'decimal'}" value="${val(k)}" placeholder="0" autocomplete="off">
    ${opts.step?`<button type="button" data-act="fstep" data-f="${k}" data-d="-${opts.step===true?1:opts.step}" aria-label="إنقاص">${ic('minus',18,2.2)}</button>`:`<span class="u">${opts.u||''}</span>`}</div>
    <span class="help" id="fh-${k}">${opts.help||''}</span></div>`;
  layer.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">
  <div class="grab"></div><div class="sh"><div class="iconbtn ghost" style="color:var(--brand-text)">${ic(draftIsNew?'plus':'pencil',20,2)}</div><h2 id="sh-t">${draftIsNew?'إضافة حذاء جديد':'تعديل الحذاء'}</h2>
  <button class="iconbtn ghost" data-act="close" aria-label="إغلاق">${ic('x',22,2)}</button></div>
  <form class="sb" id="pform" novalidate>
    <div class="field"><label for="f-name">اسم الحذاء <span class="req">*</span></label><div class="inp" id="fw-name"><input id="f-name" data-sf="name" value="${esc(draft.name)}" placeholder="مثال: باسكيت 125 كبار" autocomplete="off"><span class="u">${ic('tag',18)}</span></div><span class="help" id="fh-name"></span></div>
    <div class="grid2">${nfld('cartons','عدد الكراطين',{req:1,int:1,step:1,help:'كراطين في الطلبية'})}${nfld('perCarton','حبات في الكرطون',{req:1,int:1,u:'حبة'})}</div>
    <div class="grid2">${nfld('buy','سعر الشراء',{req:1,step:1,u:cur(),help:'للحبة الواحدة'})}${nfld('sell','سعر البيع',{req:1,step:1,u:cur()})}</div>
    <div id="fbox-spc">${nfld('soldPerCarton','المباع من كل كرطون',{req:1,int:1,step:1,u:'حبة',help:'عدد الحبات التي تتوقع بيعها من كل كرطون'})}</div>
    <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 14px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;margin-top:2px"><div><b>تضمين في حسابات الطلبية</b><small style="display:block;color:var(--muted);font-size:12px">إذا عُطّل، فسيُستبعد من التكاليف والأرباح الكلية للطلبية</small></div><button type="button" class="sw ${draft.disabled?'':'on'}" id="f-sw-inc" data-act="f-tog-inc" role="switch" aria-checked="${!draft.disabled}"><span class="knob"></span></button></div>
    <button type="button" class="more" data-act="more" aria-expanded="${showMore}">${ic('sliders',18)}<span>خيارات إضافية (مصاريف/كرطون، سعر التصفية، ملاحظات)</span>${ic(showMore?'chevU':'chevD',18,2)}</button>
    <div id="morebox" class="stack" ${showMore?'':'hidden'}>
      <div class="grid2">${nfld('extraPerCarton','مصاريف لكل كرطون',{u:cur(),help:'اختياري'})}${nfld('clearance','سعر التصفية',{u:cur(),help:'للحبات غير المباعة'})}</div>
      <div class="field"><label for="f-notes">ملاحظات</label><textarea class="notes" id="f-notes" data-sf="notes" placeholder="مورد، لون، مقاسات…">${esc(draft.notes)}</textarea></div>
    </div>
    <button type="submit" hidden></button>
  </form>
  <div class="sf"><div class="preview" id="fprev"></div><button class="btn primary block" data-act="fsave">${ic('check',20,2.4)} ${draftIsNew?'حفظ الحذاء':'حفظ التعديلات'}</button><button class="btn textonly" data-act="close">إلغاء</button></div>
  </div></div>`;
  document.body.style.overflow='hidden';
  document.getElementById('pform').addEventListener('submit',e=>{e.preventDefault();saveSheet()});
  sheetUpdate(false);
  setTimeout(()=>{const f=document.getElementById(draftIsNew?'f-name':'f-sell');f&&f.focus()},60);
}
function readDraft(){
  const errs={};
  draft.name=document.getElementById('f-name').value;
  for(const k in FIELDS){const el=document.getElementById('f-'+k);const r=parseNum(el.value);if(!r.ok){errs[k]='أدخل رقماً صحيحاً';draft[k]=NaN}else{draft[k]=r.v;if(r.empty&&!FIELDS[k].opt)draft['_e_'+k]=1;else delete draft['_e_'+k]}}
  draft.notes=document.getElementById('f-notes').value;
  return Object.assign(validate(draft),errs);
}
function sheetUpdate(showAll){
  const errs=readDraft();
  if(showAll) for(const k in FIELDS) if(draft['_e_'+k]&&!FIELDS[k].opt&&k!=='soldPerCarton'&&!errs[k]) errs[k]='هذه الخانة مطلوبة';
  const others=state.products.filter(p=>p.id!==draft.id);
  const helps={cartons:'كراطين في الطلبية',perCarton:draft.perCarton>0&&draft.cartons>0?`المجموع: ${nf.format(draft.cartons*draft.perCarton)} حبة`:'',buy:'للحبة الواحدة',
    sell:draft.sell>0&&draft.buy>0?`${draft.sell-draft.buy>=0?'+':''}${nf.format(r2(draft.sell-draft.buy))} ${state.settings.currency} للحبة قبل المصاريف`:'',soldPerCarton:'عدد الحبات التي تتوقع بيعها من كل كرطون',extraPerCarton:'اختياري',clearance:'للحبات غير المباعة'};
  if(draft.name.trim()&&others.some(p=>p.name.trim()===draft.name.trim())) helps.name='تنبيه: يوجد حذاء بنفس الاسم';
  ['name',...Object.keys(FIELDS)].forEach(k=>{
    const show=errs[k]&&(showAll||k==='soldPerCarton'||k!=='name'&&!draft['_e_'+k]);
    const w=document.getElementById('fw-'+k),h=document.getElementById('fh-'+k);
    if(!w) return;
    w.classList.toggle('bad',!!show);
    h.className='help'+(show?' e':''); h.textContent=show?errs[k]:(helps[k]||'');
  });
  document.getElementById('fbox-spc').className=errs.soldPerCarton&&!draft._e_soldPerCarton?'errbox':'';
  if(showAll&&(errs.extraPerCarton||errs.clearance)&&!showMore) toggleMore();
  const prev=document.getElementById('fprev');
  const valid=Object.keys(errs).length===0;
  if(valid&&draft.cartons>0&&draft.perCarton>0){
    const c=calc(draft,draft.disabled?Object.assign({},state.settings,{shared:0}):state.settings,totalPiecesOf(others.filter(x=>!x.disabled))+draft.cartons*draft.perCarton);
    prev.className='preview '+c.status.tone; prev.innerHTML=`${ic('trend',20,2)}<span class="m">الفائدة المتوقعة: <b class="${tone(c.net)}">${money(c.net)}</b>${draft.disabled?' <small style="display:inline;color:var(--muted)">(مستبعد من مجاميع الطلبية)</small>':''}</span>${draft.disabled?'<span class="chip neutral">'+ic('x',12,2)+' مستبعد</span>':chip(c.status)}`;
  } else {prev.className='preview warn';prev.innerHTML=`${ic('info',20,2)}<span class="m">أكمل الخانات المطلوبة لرؤية الفائدة المتوقعة.</span>`;}
  return errs;
}
function toggleMore(){showMore=!showMore;document.getElementById('morebox').hidden=!showMore;const b=document.querySelector('[data-act="more"]');b.setAttribute('aria-expanded',showMore);b.lastElementChild.outerHTML=ic(showMore?'chevU':'chevD',18,2)}
function saveSheet(){
  const errs=sheetUpdate(true);
  const req=Object.keys(FIELDS).filter(k=>!FIELDS[k].opt&&draft['_e_'+k]&&k!=='soldPerCarton');
  if(Object.keys(errs).length||req.length){const first=document.querySelector('.inp.bad input');first&&first.focus();toast('صحّح الخانات المحددة بالأحمر');return}
  const p=cleanP(draft); p.name=p.name.trim();
  if(draftIsNew){state.products.push(p);save();closeLayer();toast('تمت إضافة الحذاء');go('item-'+p.id)}
  else{const i=state.products.findIndex(x=>x.id===p.id);state.products[i]=p;save();closeLayer();toast('تم حفظ التعديلات');render()}
}

/* ---------- downloads, import, export ---------- */
let dlNs=null;
async function getDl(){if(dlNs) return dlNs; try{if(window.claude&&window.claude.use) dlNs=await window.claude.use('downloads')}catch(e){} return dlNs}
getDl();
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function saveFile(filename,data,mime){
  const dl=await getDl();
  if(dl){await dl.save({filename,data});return}
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  if(isIOS&&window.File&&navigator.canShare){const file=new File([blob],filename,{type:mime});if(navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
const today=()=>new Date().toISOString().slice(0,10);
function exportObj(){return {app:'talabiya-calc',v:1,exportedAt:new Date().toISOString(),settings:state.settings,products:state.products.map(({id,...r})=>Object.assign({id},r))}}
async function exportJson(){
  const json=JSON.stringify(exportObj(),null,2);
  try{await saveFile(`talabiya-backup-${today()}.json`,json,'application/json');state.lastBackup=Date.now();save();toast('تم حفظ النسخة الاحتياطية');render()}
  catch(e){if(e&&(e.code==='declined'||e.name==='AbortError')) toast('أُلغي الحفظ'); else if(e&&e.code==='rate_limited') toast('انتظر قليلاً ثم أعد المحاولة'); else copyFallback(json)}
}
async function copyFallback(json){
  try{await navigator.clipboard.writeText(json);state.lastBackup=Date.now();save();toast('التنزيل غير متاح هنا — نُسخت البيانات، الصقها في ملف ملاحظات');render()}
  catch(e){toast('التنزيل غير متاح في هذه النافذة')}
}
function applyImport(d,label){
  const n=d.products.length;
  confirmBox({title:'استبدال البيانات الحالية؟',body:`سيتم استبدال ${state.products.length} موديلات الحالية بـ ${n} موديلات من ${label}.`,yes:'استيراد'},()=>{
    state.products=d.products; state.settings=d.settings; save(); toast(`تم استيراد ${n} موديلات`); go('products');
  });
}
document.getElementById('file-json').addEventListener('change',e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{try{const d=cleanState(JSON.parse(rd.result));if(!d) throw 0;applyImport(d,'ملف النسخة الاحتياطية')}catch(err){toast('الملف غير صالح — اختر ملف نسخة احتياطية من هذه الحاسبة')}};
  rd.readAsText(f);
});
let xlsxP=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxP) xlsxP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>{xlsxP=null;rej()};document.head.appendChild(s)});
  return xlsxP;
}
document.getElementById('file-xlsx').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{
    toast('جارٍ قراءة الملف…');
    const X=await loadXLSX(); const wb=X.read(await f.arrayBuffer());
    const ws=wb.Sheets['المدخلات']||wb.Sheets[wb.SheetNames[0]];
    const rows=X.utils.sheet_to_json(ws,{header:1,defval:null}).slice(1);
    const products=rows.filter(r=>r&&r[0]!=null&&String(r[0]).trim()).map(r=>cleanP({name:String(r[0]).trim(),cartons:r[1],perCarton:r[2],buy:r[3],sell:r[4],soldPerCarton:r[5],extraPerCarton:r[6],clearance:r[7],notes:r[8]??''}));
    if(!products.length) throw 0;
    const settings=Object.assign({},state.settings);
    const ss=wb.Sheets['الإعدادات'];
    if(ss){if(ss.B3&&typeof ss.B3.v==='number')settings.shared=Math.max(0,ss.B3.v);if(ss.B4&&typeof ss.B4.v==='number')settings.target=Math.min(.95,Math.max(0,ss.B4.v))}
    applyImport({products,settings},'ملف Excel');
  }catch(err){toast(window.XLSX?'تعذّرت قراءة الملف — تأكد أنه ملف الحاسبة وفيه ورقة «المدخلات»':'أداة Excel غير محفوظة بعد — افتح التطبيق مرة مع الإنترنت')}
});
async function exportXlsx(){
  let X; try{X=await loadXLSX()}catch(e){toast('أداة Excel غير محفوظة بعد — افتح التطبيق مرة مع الإنترنت');return}
  const {rows,t}=compute(), s=state.settings;
  const wb=X.utils.book_new(); wb.Workbook={Views:[{RTL:true}]};
  const sum=[['ملخص الطلبية'],[],['الكمية'],['عدد الأحذية',t.count],['عدد الكراطين',t.cartons],['مجموع الحبات',t.pieces],[],['التكلفة'],['مجموع الشراء',r2(t.purchase)],['مصاريف إضافية',r2(t.extra)],['رأس المال المطلوب',r2(t.cost)],[],
    ['البيع والربح'],['الحبات المباعة',t.sold],['الحبات المتبقية',t.remaining],['نسبة البيع',r2(t.sellThrough)],['المداخيل المتوقعة',r2(t.revenue)],['الفائدة الصافية',r2(t.net)],['هامش الربح الصافي',r2(t.netMargin)],['العائد ROI',r2(t.roi)],['قيمة المتبقي',r2(t.remainingValue)],[],
    ['المنتجات'],['الأكثر ربحاً',t.best?t.best.p.name:''],['الأقل ربحاً',t.worst?t.worst.p.name:''],['عليها تنبيه ⚠',t.alerts]];
  const inp=[['اسم الحذاء','كراطين','حبات/كرطون','سعر الشراء','سعر البيع','المباع/كرطون','مصاريف/كرطون (اختياري)','سعر التصفية (اختياري)','ملاحظات'],
    ...state.products.map(p=>[p.name,p.cartons,p.perCarton,p.buy,p.sell,p.soldPerCarton,p.extraPerCarton||null,p.clearance||null,p.notes||null])];
  const cal=[COLS.map(c=>c[0]),...rows.map(r=>[r.p.name,r.pieces,r2(r.cartonPrice),r2(r.purchase),r2(r.extra),r2(r.cost),r2(r.unitCost),r2(r.unitProfit),r2(r.margin),r.sold,r.remaining,r2(r.sellRate),r2(r.sales),r2(r.clearanceRev),r2(r.revenue),r2(r.net),r2(r.perCarton),r2(r.roi),r2(r.remainingValue),r.breakeven,r.suggested,(r.status.tone==='good'?'✓ ':'⚠ ')+r.status.label]),
    ['المجموع',t.pieces,null,r2(t.purchase),r2(t.extra),r2(t.cost),null,null,null,t.sold,t.remaining,null,r2(t.sales),r2(t.clearanceRev),r2(t.revenue),r2(t.net),null,r2(t.roi),r2(t.remainingValue)]];
  const set=[['الإعدادات'],[],['مصاريف مشتركة للطلبية (نقل، جمارك...)',s.shared],['هامش الربح المستهدف',s.target]];
  const add=(aoa,name,w)=>{const ws=X.utils.aoa_to_sheet(aoa);ws['!cols']=w.map(x=>({wch:x}));X.utils.book_append_sheet(wb,ws,name)};
  add(sum,'الملخص',[24,18]);add(inp,'المدخلات',[22,8,11,11,11,12,20,20,24]);add(cal,'الحسابات',[22,...Array(21).fill(13)]);add(set,'الإعدادات',[40,12]);
  const buf=X.write(wb,{type:'array',bookType:'xlsx'});
  const XM='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  try{await saveFile(`talabiya-${today()}.xlsx`,new Blob([buf],{type:XM}),XM);toast('تم تصدير ملف Excel')}
  catch(e){toast(e&&(e.code==='declined'||e.name==='AbortError')?'أُلغي الحفظ':'تعذّر حفظ الملف')}
}

/* ---------- events ---------- */
const A={
  install:async()=>{if(!installEvt)return;installEvt.prompt();try{await installEvt.userChoice}catch(e){}installEvt=null;render()},
  theme:toggleTheme,
  add:()=>openSheet(null),
  edit:el=>{ui.menu=false;openSheet(el.dataset.id)},
  open:el=>{if(el.dataset.id) go('item-'+el.dataset.id)},
  review:()=>{ui.filter='review';ui.table=false;go('products')},
  filter:el=>{ui.filter=el.dataset.v;document.querySelectorAll('[data-act="filter"]').forEach(b=>b.setAttribute('aria-pressed',b===el));document.getElementById('plist').innerHTML=plistHtml()},
  table:()=>{ui.table=!ui.table;render()},
  menu:()=>{ui.menu=!ui.menu;render()},
  dup:el=>{ui.menu=false;const p=state.products.find(x=>x.id===el.dataset.id);const c=Object.assign({},p,{id:uid(),name:p.name+' (نسخة)'});state.products.splice(state.products.indexOf(p)+1,0,c);save();toast('تم نسخ المنتج');go('item-'+c.id)},
  del:el=>{ui.menu=false;render();const p=state.products.find(x=>x.id===el.dataset.id);
    confirmBox({title:'حذف هذا الحذاء؟',body:`سيُحذف «${esc(p.name)}» وكل حساباته. لا يمكن التراجع إلا من نسخة احتياطية.`,yes:'حذف',danger:true},()=>{state.products=state.products.filter(x=>x!==p);save();toast('تم الحذف');go('products')})},
  dstep:el=>{const inp=document.getElementById('d-'+el.dataset.f);const r=parseNum(inp.value);inp.value=r2(Math.max(0,(r.ok?r.v:0)+Number(el.dataset.d)));onDetailInput(inp)},
  fstep:el=>{const inp=document.getElementById('f-'+el.dataset.f);const r=parseNum(inp.value);inp.value=r2(Math.max(0,(r.ok?r.v:0)+Number(el.dataset.d)));sheetUpdate(false)},
  apply:el=>{const p=state.products.find(x=>x.id===route().id);p.sell=Number(el.dataset.v);ui.whatIf=p.sell;save();document.getElementById('d-sell').value=p.sell;detailCalc();toast('تم تحديث سعر البيع')},
  'toggle-p':el=>{const p=state.products.find(x=>x.id===el.dataset.id);if(!p)return;p.disabled=!p.disabled;save();toast(p.disabled?'تم استبعاد الحذاء من الحسابات':'تم تضمين الحذاء في الحسابات');render()},
  'f-tog-inc':el=>{draft.disabled=!draft.disabled;el.classList.toggle('on',!draft.disabled);el.setAttribute('aria-checked',!draft.disabled);sheetUpdate(false)},
  more:toggleMore,
  fsave:saveSheet,
  close:closeLayer,
  scrim:(el,e)=>{if(e.target===el) closeLayer()},
  'export-json':exportJson,'export-xlsx':exportXlsx,
  'import-json':()=>document.getElementById('file-json').click(),
  'import-xlsx':()=>document.getElementById('file-xlsx').click(),
  reset:()=>confirmBox({title:'مسح كل البيانات؟',body:'ستُحذف كل الموديلات والإعدادات من هذا الجهاز. ننصح بتصدير نسخة احتياطية أولاً.',yes:'مسح الكل',danger:true},()=>{state={v:1,settings:{shared:0,target:0.3,currency:'دج'},products:[],savedAt:null,lastBackup:null};save();toast('تم مسح البيانات');go('summary')})
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el){if(ui.menu&&!e.target.closest('.menu')){ui.menu=false;render()}return}
  if(el.tagName==='A') return;
  const fn=A[el.dataset.act]; if(fn){if(el.dataset.act!=='scrim')e.preventDefault();fn(el,e)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&layer.innerHTML)closeLayer();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('pcard')&&e.target.dataset.act==='open'){e.preventDefault();go('item-'+e.target.dataset.id)}
});
function onDetailInput(el){
  const p=state.products.find(x=>x.id===route().id); if(!p) return;
  const k=el.dataset.dfield;
  if(k==='notes'){p.notes=el.value;saveSoon();return}
  const r=parseNum(el.value);
  const errEl=document.getElementById('e-'+k), w=document.getElementById('w-'+k);
  const trial=Object.assign({},p,{[k]:r.ok?r.v:NaN});
  const errs=r.ok?validate(trial):{[k]:'أدخل رقماً صحيحاً'};
  ['soldPerCarton','perCarton',k].forEach(f=>{const ee=document.getElementById('e-'+f),ww=document.getElementById('w-'+f);if(ee){ee.textContent=errs[f]||'';ww.classList.toggle('bad',!!errs[f])}});
  if(errs[k]||(k==='perCarton'&&errs.soldPerCarton)) return;
  p[k]=r.v; if(k==='sell') ui.whatIf=p.sell;
  saveSoon(); detailCalc();
}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){ui.q=el.value;document.getElementById('plist').innerHTML=plistHtml();return}
  if(el.dataset.dfield){onDetailInput(el);return}
  if(el.dataset.sf){sheetUpdate(false);return}
  if(el.id==='wi'){ui.whatIf=Number(el.value);const p=state.products.find(x=>x.id===route().id);document.getElementById('wi-price').innerHTML=money(ui.whatIf);document.getElementById('wi-out').innerHTML=wiOut(p);return}
  if(el.dataset.set){
    const k=el.dataset.set;
    if(k==='currency'){state.settings.currency=el.value.trim()||'دج';saveSoon();return}
    const r=parseNum(el.value);const ok=r.ok&&r.v>=0&&(k!=='target'||r.v<95);
    el.parentElement.classList.toggle('bad',!ok); if(!ok) return;
    state.settings[k]=k==='target'?r.v/100:r.v; saveSoon();
  }
});
document.addEventListener('change',e=>{if(e.target.id==='sort'){ui.sort=e.target.value;document.getElementById('plist').innerHTML=plistHtml()}});
document.getElementById('fab').innerHTML=ic('plus',28,2.2);

render();

  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
window.addEventListener('offline',()=>toast('أنت غير متصل — التطبيق يعمل عادياً'));
window.addEventListener('online',()=>toast('عاد الاتصال'));
})();
